actions:
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  apisListed: 0
  reason: |
    Nothing was fabricated. Flight Network publishes no API, so apis[] is empty and
    no openapi/ directory was created. The company identity, the distribution
    position, and the switching-cost evidence are recorded instead — which is the
    finding: a national-scale OTA whose entire external contract is an HTML booking
    funnel behind Akamai.
