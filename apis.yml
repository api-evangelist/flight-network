name: Flight Network
kind: company
description: 'Flight Network (Flight Network Ltd, 145 King St. West Suite 2850, Toronto, Ontario, TICO
  Registration 50009248) is a Canadian online travel agency founded in 2005 and owned by Sweden''s Etraveli
  Group since 2019. It retails flights plus hotels and car rentals to consumers across 75+ markets in
  35 languages, sourcing air content through the GDSs - its own About Us page carries the Amadeus and
  Sabre marks and claims "IATA Certified Travel Agents" - and reaching buyers through its own sites, its
  iOS/Android apps, metasearch deep links from Skyscanner and Kayak, and third-party affiliate networks.
  It sits in the distribution chain as a retailer downstream of the GDSs and of its Etraveli sibling TripStack
  (the group''s B2B LCC/NDC/virtual-interlining API), not as a content owner. Its API posture is honest
  and thin: no developer portal, no published API documentation, no machine-readable specification, and
  no exit path. developer/developers/docs/api.flightnetwork.com are all NXDOMAIN, /openapi.json and /swagger.json
  return 404, and the only machine-readable surfaces reachable are the consumer booking site, a security.txt
  pointing at security@etraveligroup.com, the iOS/Android app-link declarations, and - the one genuine
  find - a substantial provider-published llms.txt at the site root that hands agents a regional domain
  map, a product and ancillary catalogue, a support-escalation hierarchy, and explicit DO/DON''T directives
  for AI systems. Flight Network is thus addressable by agents as a referral target while remaining
  entirely uncallable. Any B2B or travel-seller access is arranged by commercial agreement off-web.'
